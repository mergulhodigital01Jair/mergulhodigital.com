  <style>:root {
  --cream: #f5f0e6;
  --paper: #fffdf8;
  --forest: #183b2b;
  --forest-deep: #102a20;
  --terracotta: #a65436;
  --gold: #c39a55;
  --ink: #26231f;
  --muted: #6b655d;

}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 17px;

}
main { overflow: hidden; }
img { max-width: 100%; height: auto; }
.shell { width: min(1160px, calc(100% - 40px)); margin-inline: auto; }
.section { padding: 100px 0; }
.eyebrow { margin: 0 0 18px; color: var(--terracotta); font-size: .74rem; font-weight: 800; letter-spacing: .2em; }
.eyebrow.gold { color: var(--gold); }
h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; line-height: 1.07; letter-spacing: -.03em; margin: 0; }
h1 { font-size: clamp(2.65rem, 5.4vw, 5.25rem); }
h2 { font-size: clamp(2.1rem, 4vw, 3.65rem); }
h3 { font-size: 1.3rem; line-height: 1.3; }
p { margin: 0 0 20px; }
a { color: inherit; }
.check { display: inline-grid; flex: 0 0 auto; place-items: center; width: 23px; height: 23px; border-radius: 50%; background: var(--forest); color: white; font-size: .75rem; }
.cta {
  display: inline-flex;

  justify-content: space-between;
  gap: 30px;
  min-height: 62px;
  padding: 16px 22px 16px 26px;
  border-radius: 4px;

  color: #fff;
  box-shadow: 0 14px 28px rgba(123,51,30,.18);
  font-size: .87rem;
  font-weight: 800;
  letter-spacing: .04em;
  text-decoration: none;
  transition: transform .2s, background .2s;
}
.cta:hover { background: #8f432a; transform: translateY(-2px); }
.cta:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.cta span { font-size: 1.3rem; }

.trust { margin: 12px 0 0; color: var(--muted); font-size: .75rem; }

.heroCopy { position: relative; z-index: 2; }

.priceLine span { grid-column: 1 / -1; color: var(--muted); font-size: .85rem; }
.priceLine strong { font: 500 2.8rem/1 Georgia, serif; color: var(--forest); }
.priceLine small { margin: 0 0 4px 10px; color: var(--muted); }
.heroVisual { position: relative; display: grid; place-items: center; min-height: 570px; }
.imageHalo { position: absolute; width: 460px; height: 460px; border-radius: 50%; background: #e5dac8; }
.mockup { position: relative; z-index: 1; width: 112%; max-width: none; mix-blend-mode: multiply; filter: drop-shadow(0 28px 24px rgba(36,27,18,.15)); }
.editionTag { position: absolute; z-index: 2; right: 2%; bottom: 7%; display: flex; flex-direction: column; padding: 14px 18px; background: var(--forest); color: white; box-shadow: 0 10px 24px rgba(0,0,0,.18); }
.editionTag b { color: var(--gold); font-size: .75rem; letter-spacing: .18em; }

.recognition h2 { max-width: 650px; margin-bottom: 38px; }
.recognitionList { border-top: 1px solid var(--line); }
.recognitionList article { display: grid; grid-template-columns: 48px 1fr; gap: 14px; padding: 20px 0; border-bottom: 1px solid var(--line); }
.recognitionList span { color: var(--gold); font-family: Georgia, serif; font-size: 1.3rem; }
